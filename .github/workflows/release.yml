name: Release
on:
  push:
    tags: ["v*.*.*"]
jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: api, dockerfile: deploy/Dockerfile.api, context: . }
          - { name: web, dockerfile: deploy/Dockerfile.web, context: . }
          - { name: worker, dockerfile: deploy/Dockerfile.worker, context: . }
          - { name: media-service, dockerfile: services/media-service/Dockerfile, context: services/media-service }
          - { name: recommender, dockerfile: services/recommender/Dockerfile, context: services/recommender }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/learnsphere/${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/learnsphere/${{ matrix.name }}:latest
